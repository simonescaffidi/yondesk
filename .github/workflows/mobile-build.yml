name: Build mobile app

# Pubblica l'APK Android su GitHub Releases (e prepara il pacchetto .aab per Google Play).
# Parte da un tag v* o da un push sul branch ci-release, solo se "Test app" è verde per quel commit.
on:
  push:
    tags: ['v*']
    branches: ['ci-release']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  test-verdi:
    name: Test verdi per questo commit
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/test-apps.yml/runs?head_sha=${{ github.sha }}&status=success" -q '.total_count')
          echo "Esecuzioni verdi di 'Test app' per ${{ github.sha }}: $n"
          [ "$n" -ge 1 ] || { echo "::error::I test delle app non sono verdi per questo commit: pubblicazione bloccata"; exit 1; }

  android:
    needs: test-verdi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable', flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true }
      - name: Firma di rilascio (solo se i secret esistono)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/yondesk-release.jks"
            {
              echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/yondesk-release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Android: firma di rilascio ATTIVA"
          else
            echo "::warning::Android: nessuna chiave di rilascio -> APK con firma di prova (non aggiornabile sopra una versione precedente, non adatto a Google Play)"
          fi
      - name: Pub get
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Build App Bundle (Google Play)
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: yondesk-android-aab
          path: mobile/build/app/outputs/bundle/release/*.aab
          retention-days: 30
      - name: Compute tag from version
        id: ver
        run: echo "tag=v$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)" >> "$GITHUB_OUTPUT"
      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.tag }}
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
