name: Build mobile app

on:
  push:
    tags: ['v*']
    branches: ['ci-release']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable', flutter-version: '3.24.5' }
      - name: Generate platform folders
        run: flutter create --platforms=android,ios .
      - name: Patch permissions
        run: bash tool/patch_platforms.sh
      - name: Pub get
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: yondesk-android
          path: mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: ignore
      - name: Compute tag from version
        id: ver
        run: echo "tag=v$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)" >> "$GITHUB_OUTPUT"
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/ci-release' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.tag }}
          files: mobile/build/app/outputs/flutter-apk/*.apk
          fail_on_unmatched_files: false

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable', flutter-version: '3.24.5' }
      - run: flutter create --platforms=ios .
      - run: bash tool/patch_platforms.sh
      - run: flutter pub get
      - name: Build iOS (no signing)
        run: flutter build ios --release --no-codesign
