name: Build desktop agent

# Pubblica gli installer desktop su GitHub Releases.
# Parte da un tag v* o da un push sul branch ci-release (stesso commit di main).
# Ogni installer viene pubblicato solo se: 1) i test "Test app" sono verdi per quel commit,
# 2) l'app appena pacchettizzata supera la sessione reale tra due istanze su quel sistema operativo.
on:
  push:
    tags: ['v*']
    branches: ['ci-release']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  test-verdi:
    name: Test verdi per questo commit
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/test-apps.yml/runs?head_sha=${{ github.sha }}&status=success" -q '.total_count')
          echo "Esecuzioni verdi di 'Test app' per ${{ github.sha }}: $n"
          [ "$n" -ge 1 ] || { echo "::error::I test delle app non sono verdi per questo commit: pubblicazione bloccata"; exit 1; }

  build:
    needs: test-verdi
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest }
          - { os: macos-latest }
          - { os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        shell: bash
        run: |
          npm ci
          (cd ../server && npm ci)
      - name: Prepare macOS signing env (solo se i secret esistono)
        if: runner.os == 'macOS'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CSC_LINK" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            {
              echo "CSC_LINK=$MAC_CSC_LINK"
              echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD"
              echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8"
              echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
              echo "MAC_FIRMATA=1"
            } >> "$GITHUB_ENV"
            echo "macOS: firma Developer ID + notarizzazione ATTIVE"
          else
            echo "macOS: nessun secret di firma -> build ad-hoc"
          fi
      - name: Prepare Windows signing env (solo se i secret esistono)
        if: runner.os == 'Windows'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$WIN_CSC_LINK" ]; then
            {
              echo "CSC_LINK=$WIN_CSC_LINK"
              echo "CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Windows: firma Authenticode ATTIVA"
          else
            echo "Windows: nessun certificato -> build non firmata (SmartScreen avvisa al primo avvio)"
          fi
      - name: Build
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Installa l'app come farebbe un utente
        shell: bash
        working-directory: agent-desktop
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -q && sudo apt-get install -y -q ./dist/Yondesk.deb libfuse2t64 || sudo apt-get install -y -q ./dist/Yondesk.deb
            ls -la /opt/Yondesk/yondesk
            echo "YONDESK_APP_BIN=/opt/Yondesk/yondesk" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            hdiutil attach dist/Yondesk-mac-arm64.dmg -nobrowse -mountpoint "$RUNNER_TEMP/dmg"
            cp -R "$RUNNER_TEMP/dmg/Yondesk.app" "$RUNNER_TEMP/Yondesk.app"
            hdiutil detach "$RUNNER_TEMP/dmg"
            echo "YONDESK_APP_BIN=$RUNNER_TEMP/Yondesk.app/Contents/MacOS/Yondesk" >> "$GITHUB_ENV"
          else
            powershell -NoProfile -Command '$p = Start-Process -FilePath dist\Yondesk-Setup.exe -ArgumentList "/S" -Wait -PassThru; if ($p.ExitCode -ne 0) { throw "installer terminato con codice $($p.ExitCode)" }; $exe = Join-Path $env:ProgramFiles "Yondesk\Yondesk.exe"; if (!(Test-Path $exe)) { throw "Yondesk.exe non installato in $exe" }; $lnk = Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs\Yondesk.lnk"; if (!(Test-Path $lnk)) { throw "collegamento nel menu Start non creato" }; Write-Host "installato: $exe, collegamento: $lnk"'
            echo "YONDESK_APP_BIN=$PROGRAMFILES/Yondesk/Yondesk.exe" >> "$GITHUB_ENV"
          fi
      - name: Verifica firma e notarizzazione (come Gatekeeper sul Mac di un utente)
        if: runner.os == 'macOS' && env.MAC_FIRMATA == '1'
        run: |
          APP="$RUNNER_TEMP/Yondesk.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|flags"
          xcrun stapler validate "$APP"
          spctl -a -vv -t exec "$APP"
      - name: Sessione reale tra due istanze dell'app installata
        working-directory: agent-desktop
        shell: bash
        run: |
          echo "app: $YONDESK_APP_BIN"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x800x24" node test/e2e/run.js
          else
            node test/e2e/run.js
          fi
      - name: Avvio delle versioni senza installazione (Portable Windows, AppImage Linux)
        if: runner.os != 'macOS'
        shell: bash
        working-directory: agent-desktop
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            chmod +x dist/Yondesk.AppImage
            (xvfb-run -a ./dist/Yondesk.AppImage --no-sandbox --user-data-dir="$RUNNER_TEMP/appimage-profile" > "$RUNNER_TEMP/appimage.log" 2>&1 &)
            sleep 20
            pgrep -af "/tmp/.mount_Yondes.*/yondesk" | head -3 || { echo "::error::l'AppImage non resta in esecuzione"; cat "$RUNNER_TEMP/appimage.log"; exit 1; }
            pkill -f "/tmp/.mount_Yondes" || true
          else
            powershell -NoProfile -Command 'Start-Process -FilePath dist\Yondesk-portable.exe -ArgumentList "--user-data-dir=$env:RUNNER_TEMP\portable-profile"; Start-Sleep -Seconds 40; $p = Get-Process -Name Yondesk -ErrorAction SilentlyContinue | Where-Object { $_.Path -notlike "*Program Files*" }; if (!$p) { throw "la versione Portable non resta in esecuzione" }; Write-Host "Portable in esecuzione: $($p[0].Path)"; $p | Stop-Process -Force'
          fi
      - name: Compute tag from version
        id: ver
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.tag }}
          files: |
            agent-desktop/dist/*.exe
            agent-desktop/dist/*.dmg
            agent-desktop/dist/*.AppImage
            agent-desktop/dist/*.deb
          fail_on_unmatched_files: false
          generate_release_notes: true
