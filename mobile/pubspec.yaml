name: yondesk
description: Yondesk - assistenza e controllo remoto (Android/iOS)
publish_to: 'none'
version: 1.1.0+10

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.6.3
  flutter_background: ^1.3.1
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.6
  http: ^1.6.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: assets/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#0b1020"
  adaptive_icon_background: "#0b1020"
  adaptive_icon_foreground: assets/icon-foreground.png
