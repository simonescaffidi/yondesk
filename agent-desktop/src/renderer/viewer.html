<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src *; img-src 'self' data:; style-src 'self' 'unsafe-inline'; media-src 'self' blob: mediastream:">
<title>Yondesk — Sessione remota</title>
<style>
  *{box-sizing:border-box;font-family:system-ui,sans-serif}
  html,body{margin:0;height:100%;background:#05070f;color:#eef2ff;overflow:hidden}
  #bar{height:44px;display:flex;align-items:center;gap:.6rem;padding:0 .8rem;background:#151d35;border-bottom:1px solid #26304f}
  #bar .s{font-size:.9rem;color:#9fb0d6}
  #bar .sp{flex:1}
  #bar button{border:1px solid #26304f;background:#1b2544;color:#eef2ff;border-radius:7px;padding:.4rem .7rem;cursor:pointer;font-weight:600;font-size:.85rem}
  #bar button:hover{background:#3b82f6;color:#06121f}
  #bar button.danger{background:#f87171;border-color:#f87171;color:#fff}
  #stage{position:absolute;top:44px;left:0;right:0;bottom:0;display:grid;place-items:center;background:#000}
  video{max-width:100%;max-height:100%;outline:none;cursor:crosshair}
  #ph{position:absolute;color:#9fb0d6;font-size:.95rem}
</style>
</head>
<body>
<div id="bar">
  <span class="s" id="status">Connessione…</span>
  <span class="sp"></span>
  <button id="clip" title="Incolla i tuoi appunti sul PC remoto">📋 Appunti</button>
  <button id="fs" title="Schermo intero">⛶</button>
  <button class="danger" id="hang">Termina</button>
</div>
<div id="stage">
  <div id="ph">In attesa dello schermo remoto…</div>
  <video id="v" playsinline autoplay tabindex="0"></video>
</div>
<script src="./yondesk.js"></script>
<script src="./viewer.js"></script>
</body>
</html>
