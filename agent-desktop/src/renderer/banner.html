<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box;font-family:system-ui,sans-serif}
  body{margin:0;height:44px;overflow:hidden}
  .bar{height:44px;display:flex;align-items:center;gap:.6rem;padding:0 .9rem;border-radius:12px;
    background:linear-gradient(90deg,#f87171,#fbbf24);color:#1a0b0b;font-weight:700;font-size:.85rem;
    box-shadow:0 6px 20px rgba(0,0,0,.4);-webkit-app-region:drag;user-select:none}
  .rec{width:12px;height:12px;border-radius:50%;background:#7f1d1d;animation:b 1.2s infinite}
  @keyframes b{50%{opacity:.3}}
  .stop{-webkit-app-region:no-drag;margin-left:auto;background:#1a0b0b;color:#fff;border:none;border-radius:8px;padding:.3rem .7rem;cursor:pointer;font-weight:700}
</style>
</head>
<body>
<div class="bar">
  <span class="rec"></span>
  <span id="txt">Sessione di assistenza remota attiva</span>
  <button class="stop" id="stop">Termina</button>
</div>
<script>
  window.agent.onSessionInfo((info) => {
    document.getElementById('txt').textContent =
      (info.control ? 'Controllo remoto attivo' : 'Condivisione schermo attiva') +
      ' · ' + (info.viewerName || 'Operatore');
  });
  document.getElementById('stop').onclick = () => window.agent.forceStop();
</script>
</body>
</html>
